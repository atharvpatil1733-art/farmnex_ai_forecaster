# farmnex_ai_forecaster configuration. Never hardcode markets/crops in code; add them here.

paths:
  raw_dir: data/raw
  mandi_csv: data/raw/mandi.csv
  synthetic_dir: data/synthetic
  ref_dir: data/ref
  artifacts_dir: artifacts
  reports_dir: reports
  ceda_cache_dir: data/raw/ceda     # raw API responses (JSON), git-ignored, rebuilt by forecaster.ceda
  exports_dir: data/raw             # website exports (*.csv/xls/xlsx): dates after CEDA ends (see data_prep.source)

# CEDA (Ashoka University) Agmarknet API: the PRIMARY real-data source.
# `python -m forecaster.ceda` downloads into ceda_cache_dir; `python -m forecaster.data` cleans it.
# Needs CEDA_API_KEY in the environment or .env (free key: https://api.ceda.ashoka.edu.in).
# Terms: free for non-commercial use; any chart/app using this data must show the CEDA logo
# (bottom right) and the text credit below, and must not imply CEDA endorses us.
ceda:
  base_url: https://api.ceda.ashoka.edu.in/v1
  state: Maharashtra
  districts: [Pune, Thane, Mumbai]  # exact CEDA census_district_name; new ones are fetched alone
  start_date: "2012-01-01"          # fetch window start; modelling decides what it trains on
  end_date: null                    # null = today (CEDA lags weeks to months behind)
  chunk_years: 5                    # multi-year requests are accepted; fewer requests = safer
  max_requests_per_run: 36          # live policy is 40 requests / rolling hour; keep headroom
  min_seconds_between_requests: 1.0
  min_chunk_days: 60                # truncated chunks are split in half down to this size
  suspicious_row_counts: [999, 1000, 5000, 10000, 50000]
  refresh_open_chunk: true          # re-fetch the chunk that ends at end_date ...
  refresh_open_chunk_hours: 24      # ... once its cached copy is older than this
  # market_id filters hang (504) on the live API, so data is fetched per district and filtered
  # locally. /agmarknet/markets is only used to NAME ids (one call per district, cached,
  # non-fatal); ids it cannot name can be mapped with a "market_id N" alias below.
  fetch_market_lists: false
  fetch_market_names: true
  attribution: "Data: Centre for Economic Data & Analysis (CEDA), Ashoka University, from Agmarknet"
  terms_url: https://ceda.ashoka.edu.in/api-terms-conditions/   # official CEDA logo is linked from this page
  logo_placement: bottom right      # CEDA terms: logo at the bottom right of any visual/app using the data

# Canonical market names. `aliases` are raw spellings seen in Agmarknet / CEDA (matched
# case-insensitively after trimming spaces; "market_id N" names a CEDA id the API cannot name).
# `has_arrivals: false` on a market drops its quantity reports (arrivals stay NaN, never invented).
markets:
  # Not modelled (CEDA names them, too little or no recent data): Pune(Hadapsar) (id 3110, stopped
  # 2020-05), Dound, Nira, Mulshi, Khed; Thane's Bhivandi, Vasai, Ulhasnagar, Murbad, Palghar,
  # Shahapur; "Mumbai- Fruit Market"; "APMC Khed" (CEDA "Khed", not Khed(Chakan); in the
  # 2026 exports from 2026-06-29 only).
  Pune:           {district: Pune, aliases: ["Pune", "Pune APMC", "Pune(Gultekdi)", "Gultekdi"]}
  Pimpri:         {district: Pune, aliases: ["Pune(Pimpri)", "Pimpri", "Pimpri Chinchwad"]}
  Manjri:         {district: Pune, aliases: ["Pune(Manjri)", "Manjri"]}
  Moshi:          {district: Pune, aliases: ["Pune(Moshi)", "Moshi"]}
  Khadki:         {district: Pune, aliases: ["Pune(Khadiki)", "Pune(Khadki)", "Khadki", "Khadiki"]}
  Khed(Chakan):   {district: Pune, aliases: ["Khed(Chakan)", "Khed (Chakan)", "Chakan"]}
  Manchar:        {district: Pune, aliases: ["Manchar"]}
  Junnar:         {district: Pune, aliases: ["Junnar"]}
  Otur:           {district: Pune, aliases: ["Junnar(Otur)", "Otur"]}
  Narayangaon:    {district: Pune, aliases: ["Junnar(Narayangaon)", "Narayangaon"]}
  Alephata:       {district: Pune, aliases: ["Junnar(Alephata)", "Alephata"]}
  Baramati:       {district: Pune, aliases: ["Baramati"]}
  Shirur:         {district: Pune, aliases: ["Shirur"]}
  Indapur:        {district: Pune, aliases: ["Indapur"]}
  # Mumbai region. Vashi = Mumbai APMC at Vashi, Navi Mumbai (in Thane district on the map; CEDA
  # files it under district "Mumbai"): "Vashi New Mumbai" is its onion-potato market, "Mumbai" its
  # vegetable market (most of the tomato). Kalyan APMC is CEDA district Thane.
  Vashi:          {district: Thane, aliases: ["Vashi", "Vashi New Mumbai", "Vashi (Navi Mumbai)", "Mumbai", "Navi Mumbai",
                                   "Mumbai-Onion & Potato Market", "APMC Mumbai"]}
  Kalyan:
    district: Thane
    aliases: ["Kalyan"]
    # CEDA quantities for Kalyan are placeholders (0.1-1.3 t/day, often the same value for all
    # three crops, 2012-14 and 2024-25); keep them out rather than call Kalyan a tiny market.
    has_arrivals: false
    arrivals_note: "CEDA quantities are placeholder values (0.1-1.3 t/day, same for all crops)"

# Canonical crop names. `has_arrivals: false` forces arrivals_tonnes to NaN (never invented).
# plausible_modal_min/max (Rs/quintal) are only used to FLAG suspicious prices in the report
# (e.g. values that look like Rs/kg); they never drop or convert rows by themselves.
crops:
  Onion:
    ceda_name: Onion          # exact commodity_name in CEDA /agmarknet/commodities
    aliases: ["Onion", "Onion Red", "Onion (Red)", "Red Onion", "Onion Green", "Kanda"]
    has_arrivals: true
    plausible_modal_min: 300
    plausible_modal_max: 8000
  Tomato:
    ceda_name: Tomato
    aliases: ["Tomato", "Tamatar", "Tomato Hybrid", "Tomato Local"]
    # The old website exports had no tomato quantity file. The API quantities endpoint may have
    # it; arrivals stay empty only if no quantity data exists (never invented).
    has_arrivals: true
    plausible_modal_min: 200
    plausible_modal_max: 8000
  Potato:
    ceda_name: Potato
    aliases: ["Potato", "Batata", "Aloo", "Potato Local"]
    has_arrivals: true
    plausible_modal_min: 300
    plausible_modal_max: 6000

data_prep:
  # Which raw data to clean:
  #   "ceda+exports" = CEDA API cache, then website exports ONLY for dates after the last CEDA
  #                    date (CEDA lags ~11 months; agmarknet.gov.in "Daily Price Arrival Report"
  #                    exports fill the gap). No day is taken from both, so nothing double-counts.
  #   "ceda" = API cache only, "exports" = website exports only,
  #   "auto" = API cache if it has any files, else the exports.
  source: ceda+exports
  # Keep market-days that have arrivals but no price (modal_price = NaN). The arrivals model
  # needs them; the price model trains only on rows where modal_price was reported.
  keep_arrivals_only_rows: true
  # Unit of arrivals in the raw quantity exports when the column name does not say it.
  # CEDA/data.gov.in "qty" for Pune APMC (~900/day onion) is consistent with tonnes, not quintals.
  default_arrivals_unit: tonnes
  outlier_window_days: 30        # rolling median window (calendar days, centred)
  outlier_min_points: 5          # need at least this many prices in the window to judge
  outlier_high_ratio: 4.0        # drop modal > 4x rolling median
  outlier_low_ratio: 0.25        # drop modal < 0.25x rolling median
  low_coverage_warn_pct: 50      # warn when a market x crop reports on < 50% of days
  long_gap_days: 14              # gaps longer than this are listed; never interpolated
  suspicious_row_counts: [500, 1000, 5000, 10000]  # exports capped at these sizes are likely truncated

# Used by features/train (next step). Kept here so nothing is hardcoded.
modelling:
  train_start: "2015-01-01"      # older history is fetched but not trained on by default
  horizons: [1, 2, 3]            # calendar days ahead; DIRECT forecasts, never recursive
  quantiles: [0.1, 0.5, 0.9]
  test_days: 60                  # time split: last 60 days of real data are the test set
  festival_window_days: 3        # "festival within N days" feature
  monsoon_months: [6, 7, 8, 9]   # monsoon flag feature

# Synthetic fallback (forecaster/synthetic.py). Used PER market x crop and PER target (price,
# arrivals) only where real data is missing or too thin. Levels below are defaults; where real
# data exists for a crop, its real median price / per-market median arrivals replace them.
synthetic:
  years: 3                       # of daily history, ending at the real data's as_of date
  seed: 42
  min_real_days: 30              # a pair needs this many real reported days to count as "real"
  closed_weekday_share: 0.12     # share of extra random non-reporting days (on top of 1 closed weekday)
  monsoon_uplift: 0.10           # price +10% in monsoon (supply disruption)
  festival_uplift: 0.06          # price +6% within 3 days of a festival
  price_arrivals_elasticity: 1.5 # arrivals ~ (price / base)^-elasticity
  noise_ar: 0.9                  # AR(1) coefficient of the daily log-price noise
  noise_sd: 0.04
  anchor_recent_days: 60         # scale each synthetic crop so its last-60-day median = the real one
  crops:
    Onion:  {base_price: 1850, peak_month: 10, seasonal_amp: 0.35, base_arrivals: 60}
    Tomato: {base_price: 1500, peak_month: 8,  seasonal_amp: 0.45, base_arrivals: 30}
    Potato: {base_price: 1800, peak_month: 9,  seasonal_amp: 0.15, base_arrivals: 40}
  default_crop: {base_price: 2000, peak_month: 9, seasonal_amp: 0.25, base_arrivals: 30}

# LightGBM (sensible defaults, no tuning) and the monthly SARIMAX for "best crop to grow".
lightgbm:
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  n_jobs: 4
sarimax:
  order: [1, 0, 0]
  seasonal_order: [1, 0, 0, 12]
  min_months: 12                 # fewer real monthly points -> skip SARIMAX, use the fallback
  plausible_ratio: [0.33, 3.0]   # forecasts outside this x the history mean count as a failure
  months_ahead: 18
likely_closed_share: 0.25        # a weekday with < 25% of the market's typical reports -> likely closed

# Recommendations and API.
recommend:
  rate_per_km_quintal: 1.0       # Rs per km per quintal (approximate small-truck cost; one way)
  default_radius_km: 100
  demand_threshold_pct: 3.0      # price/arrivals moves smaller than this count as "flat"
  stale_days_warning: 30         # warn when a pair's last real report is older than this vs as_of
  # A market is "thin" for this sale when the farmer's load is more than this share of the
  # market's typical (median, last 90 days, real) daily arrivals: selling there would move the price.
  thin_market_share: 0.5
  depth_lookback_days: 90
api:
  # CORS: exact origins allowed (add the Flutter web app's production origin here, or set
  # FARMNEX_CORS_ORIGINS="https://app.example.com,https://staging.example.com" in the environment).
  cors_origins: []
  cors_origin_regex: '^https?://(localhost|127\.0\.0\.1)(:\d+)?$'   # local Flutter web dev on any port
  # Hide market x crop pairs that have no real prices (synthetic fallback only). When false,
  # made-up numbers never reach farmers: those pairs return 404 and are left out of /meta,
  # /forecast/demand, /forecast/sell-options and /forecast/crops. Set true for demos/testing.
  show_synthetic: false
  demand_note: >-
    Demand is a PROXY derived from mandi data (predicted modal price change vs predicted
    arrivals change), not measured consumer demand.
